<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proteus OS — Enterprise Modules</title>
    <script>
      (function () {
        var t = null;
        try {
          var q = new URLSearchParams(window.location.search).get('theme');
          if (q === 'dark' || q === 'light') t = q;
        } catch (e) {}
        if (!t) {
          try {
            var s = localStorage.getItem('proteus-theme');
            if (s === 'dark' || s === 'light') t = s;
          } catch (e) {}
        }
        if (!t) {
          try {
            t =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          } catch (e) {
            t = 'light';
          }
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.backgroundColor =
          t === 'dark' ? '#0B1120' : '#F8FAFC';
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
