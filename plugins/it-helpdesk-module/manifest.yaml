# Plugin Manifest — it-helpdesk-module (IT Service Desk nội bộ)

name: "it-helpdesk-module"
display_name: "IT Service Desk nội bộ"
version: "1.0.0"
description: |
  Hỗ trợ CNTT nội bộ, quản lý ticket, phân công kỹ thuật viên, theo dõi SLA và tự động hóa quy trình onboarding/offboarding IT.
author: "ICTU Team"
license: "AGPL-3.0-or-later"
icon_url: "/plugins/it-helpdesk-module/icon.png"
is_official: true
homepage_url: "https://github.com/CuongKenn/ICTU_Proteus-os"
category: "IT"
credentials_schema: []

compatibility:
  proteus_os_min_version: "1.0.0"
  dsl_spec_version: "1.0"

database:
  tables:
    - "it_categories"
    - "it_sla_policies"
    - "it_tickets"
    - "it_ticket_updates"
    - "it_knowledge_base"
    - "it_config"

  seed_file: "db/seed_data.sql"

workflows:
  - id: "wf_ticket_create"
    name: "Tạo Ticket & Phân công"
    trigger: "webhook"
    file: "workflows/ticket_create.json"

  - id: "wf_sla_escalation"
    name: "Cảnh báo SLA"
    trigger: "cron"
    cron_expression: "*/30 * * * *"
    file: "workflows/sla_escalation.json"

  - id: "wf_ticket_feedback"
    name: "Gửi khảo sát sau Resolve"
    trigger: "webhook"
    webhook_path: "helpdesk/ticket/feedback"
    file: "workflows/ticket_feedback.json"

  - id: "wf_weekly_it_report"
    name: "Báo cáo IT hàng tuần"
    trigger: "cron"
    cron_expression: "0 8 * * 1"
    file: "workflows/weekly_it_report.json"

dashboards:
  - id: "dash_helpdesk_overview"
    name: "Tổng quan Helpdesk & SLA"
    file: "dashboards/helpdesk_overview.json"

  - id: "dash_it_team_performance"
    name: "Hiệu suất IT Team"
    file: "dashboards/it_team_performance.json"

ui:
  appsmith_app: "ui/appsmith_app.json"
  external_url: "${PLUGINS_MFE_URL}/it-helpdesk-module"

roles:
  - name: "it_staff"
    display_name: "Nhân viên IT"
    description: "Nhân viên IT"
    permissions:
      - "it:categories:read"
      - "it:sla_policies:read"
      - "it:tickets:read"
      - "it:tickets:write"
      - "it:tickets:resolve"
      - "it:ticket_updates:read"
      - "it:ticket_updates:write"
      - "it:knowledge_base:read"
      - "it:knowledge_base:write"

  - name: "it_manager"
    display_name: "Quản lý IT"
    description: "Quản lý IT"
    permissions:
      - "it:categories:read"
      - "it:categories:write"
      - "it:sla_policies:read"
      - "it:sla_policies:write"
      - "it:tickets:read"
      - "it:tickets:read_all"
      - "it:tickets:write"
      - "it:tickets:resolve"
      - "it:ticket_updates:read"
      - "it:ticket_updates:write"
      - "it:knowledge_base:read"
      - "it:knowledge_base:write"
      - "it:knowledge_base:delete"
      - "it:config:read"
      - "it:config:write"
      - "it:reports:read"
      - "it:assign:all"

  - name: "it_requester"
    display_name: "Người dùng CNTT"
    description: "Người dùng (Nhân viên)"
    permissions:
      - "it:categories:read"
      - "it:sla_policies:read"
      - "it:tickets:read"
      - "it:tickets:write"
      - "it:ticket_updates:read"
      - "it:ticket_updates:write"
      - "it:knowledge_base:read"

event_subscriptions:
  - source_plugin: "hr-module"
    event_types:
      - "hr.employee.created"
      - "hr.employee.deactivated"
    handler_workflow: "workflows/ticket_create.json"

event_publications:
  - event_type: "it.ticket.created"
    description: "Khi ticket hỗ trợ CNTT mới được tạo"
    payload_schema:
      ticket_id: "uuid"
      priority: "string"

  - event_type: "it.ticket.resolved"
    description: "Khi ticket hỗ trợ CNTT được giải quyết"
    payload_schema:
      ticket_id: "uuid"

  - event_type: "it.sla.violated"
    description: "Khi ticket vi phạm thời hạn cam kết SLA"
    payload_schema:
      ticket_id: "uuid"
