name: "procurement-module"
display_name: "Procurement & Contract Management"
version: "1.0.0"
description: |
  Quản lý Mua sắm (Purchase Request, PO) và Quản lý Hợp đồng, Nhà cung cấp (Vendor).
author: "ICTU Team"
license: "AGPL-3.0-or-later"
is_official: true
homepage_url: "https://github.com/CuongKenn/ICTU_Proteus-os"
category: "Operations"
credentials_schema: []

compatibility:
  proteus_os_min_version: "1.0.0"
  dsl_spec_version: "1.0"

database:
  tables:
    - "procurement_requests"
    - "procurement_vendors"
    - "procurement_contracts"
    - "procurement_purchase_orders"
    - "procurement_deliveries"
    - "procurement_config"
  seed_file: "db/seed_data.sql"
  default_config:
    require_board_approval_threshold: 50000000

workflows:
  - id: "wf_purchase_request"
    file: "workflows/purchase_request.json"
    name: "Purchase Request Workflow"
    description: "Duyệt đề xuất mua hàng"
    trigger: "webhook"

  - id: "wf_po_approval"
    file: "workflows/po_approval.json"
    name: "Purchase Order Approval Workflow"
    description: "Duyệt Purchase Order"
    trigger: "webhook"

  - id: "wf_contract_expiry_alert"
    file: "workflows/contract_expiry_alert.json"
    name: "Contract Expiry Alert"
    description: "Cảnh báo hợp đồng sắp hết hạn"
    trigger: "cron"
    cron_expression: "0 9 * * 1"

  - id: "wf_vendor_evaluation"
    file: "workflows/vendor_evaluation.json"
    name: "Vendor Evaluation"
    description: "Đánh giá nhà cung cấp"
    trigger: "cron"
    cron_expression: "0 8 1 */3 *"

  - id: "wf_sync_payment_status"
    file: "workflows/sync_payment_status.json"
    name: "Sync Payment Status"
    description: "Đồng bộ trạng thái thanh toán đơn mua hàng"
    trigger: "webhook"

dashboards:
  - file: "dashboards/procurement_overview.json"
    name: "Procurement Overview"
    description: "Tổng quan mua sắm"

  - file: "dashboards/contract_tracker.json"
    name: "Contract Tracker"
    description: "Theo dõi hợp đồng"


ui:
  appsmith_app: "ui/appsmith_app.json"
  external_url: "${PLUGINS_MFE_URL}/procurement-module"
roles:
  - name: "procurement_staff"
    display_name: "Procurement Staff"
    description: "Nhân viên mua sắm"
    permissions:
      - "procurement:requests:read"
      - "procurement:requests:write"
      - "procurement:vendors:read"
      - "procurement:vendors:write"
      - "procurement:contracts:read"
      - "procurement:purchase_orders:read"
      - "procurement:purchase_orders:write"
      - "procurement:deliveries:read"
      - "procurement:deliveries:write"

  - name: "procurement_manager"
    display_name: "Procurement Manager"
    description: "Quản lý mua sắm"
    permissions:
      - "procurement:requests:read"
      - "procurement:requests:write"
      - "procurement:requests:approve"
      - "procurement:vendors:read"
      - "procurement:vendors:write"
      - "procurement:vendors:delete"
      - "procurement:contracts:read"
      - "procurement:contracts:write"
      - "procurement:purchase_orders:read"
      - "procurement:purchase_orders:write"
      - "procurement:deliveries:read"
      - "procurement:deliveries:write"
      - "procurement:config:read"
      - "procurement:config:write"
      - "procurement:po:approve"

  - name: "procurement_viewer"
    display_name: "Procurement Viewer"
    description: "Người xem thông tin mua sắm"
    permissions:
      - "procurement:requests:read"
      - "procurement:vendors:read"
      - "procurement:contracts:read"
      - "procurement:purchase_orders:read"
      - "procurement:deliveries:read"

event_subscriptions:
  - source_plugin: "finance-module"
    event_types:
      - "finance.expense_request.approved"
    handler_workflow: "workflows/sync_payment_status.json"

event_publications:
  - event_type: "procurement.purchase_order.approved"
    description: "Khi PO được duyệt"
    payload_schema:
      po_id: "uuid"

  - event_type: "procurement.contract.signed"
    description: "Khi hợp đồng được ký"
    payload_schema:
      contract_id: "uuid"

  - event_type: "procurement.delivery.received"
    description: "Khi nhận hàng hoàn tất"
    payload_schema:
      delivery_id: "uuid"

ngsi:
  entities:
    - table: "procurement_vendors"
      type: "Supplier"
      id_pattern: "urn:ngsi-ld:Supplier:{tenant}:{id}"
      attributes:
        - column: "name"
          target: "name"
          type: "Property"
        - column: "rating"
          target: "rating"
          type: "Property"
      relationships: []
      geo_attribute:
        target: "location"
    - table: "procurement_contracts"
      type: "ProcurementContract"
      id_pattern: "urn:ngsi-ld:ProcurementContract:{tenant}:{id}"
      attributes:
        - column: "contract_number"
          target: "contractNumber"
          type: "Property"
        - column: "title"
          target: "title"
          type: "Property"
        - column: "start_date"
          target: "startDate"
          type: "Property"
        - column: "end_date"
          target: "endDate"
          type: "Property"
        - column: "status"
          target: "status"
          type: "Property"
      relationships:
        - column: "vendor_id"
          target: "suppliedBy"
          entity_type: "Supplier"
          id_pattern: "urn:ngsi-ld:Supplier:{tenant}:{vendor_id}"
    - table: "procurement_purchase_orders"
      type: "PurchaseOrder"
      id_pattern: "urn:ngsi-ld:PurchaseOrder:{tenant}:{id}"
      attributes:
        - column: "total_amount"
          target: "totalCost"
          type: "Property"
        - column: "delivery_date"
          target: "expectedDelivery"
          type: "Property"
        - column: "status"
          target: "status"
          type: "Property"
        - column: "created_at"
          target: "orderDate"
          type: "Property"
      relationships:
        - column: "contract_id"
          target: "basedOnContract"
          entity_type: "ProcurementContract"
          id_pattern: "urn:ngsi-ld:ProcurementContract:{tenant}:{contract_id}"
