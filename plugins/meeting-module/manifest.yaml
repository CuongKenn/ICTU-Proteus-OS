# Plugin Manifest — meeting-module (Quản lý Cuộc họp Phòng họp)

name: "meeting-module"
display_name: "Quản lý Cuộc họp & Phòng họp"
version: "1.0.0"
description: |
  Quản lý đặt phòng họp, gửi thư mời, ghi biên bản (meeting minutes) và theo dõi action items sau cuộc họp.
author: "ICTU Team"
license: "AGPL-3.0-or-later"
icon_url: "/plugins/meeting-module/icon.png"
is_official: true
homepage_url: "https://github.com/CuongKenn/ICTU_Proteus-os"
category: "Communication"
credentials_schema: []

compatibility:
  proteus_os_min_version: "1.0.0"
  dsl_spec_version: "1.0"

database:
  tables:
    - "meeting_rooms"
    - "meeting_bookings"
    - "meeting_attendees"
    - "meeting_agendas"
    - "meeting_minutes"
    - "meeting_action_items"

  seed_file: "db/seed_data.sql"

workflows:
  - id: "wf_meeting_booking"
    name: "Đặt phòng & Gửi invite"
    trigger: "webhook"
    file: "workflows/meeting_booking.json"

  - id: "wf_meeting_reminder"
    name: "Nhắc họp trước 30 phút"
    trigger: "cron"
    cron_expression: "*/15 * * * *"
    file: "workflows/meeting_reminder.json"

  - id: "wf_action_item_followup"
    name: "Follow-up Action Items"
    trigger: "cron"
    cron_expression: "0 9 * * 1"
    file: "workflows/action_item_followup.json"

  - id: "wf_room_release"
    name: "Tự động giải phóng phòng"
    trigger: "cron"
    cron_expression: "*/5 * * * *"
    file: "workflows/room_release.json"

dashboards:
  - id: "dash_meeting_stats"
    name: "Thống kê Cuộc họp"
    file: "dashboards/meeting_stats.json"

  - id: "dash_action_item_tracker"
    name: "Theo dõi Action Items"
    file: "dashboards/action_item_tracker.json"

ui:
  appsmith_app: "ui/appsmith_app.json"
  external_url: "${PLUGINS_MFE_URL}/meeting-module"

roles:
  - name: "meeting_organizer"
    display_name: "Người Tổ chức Cuộc họp"
    description: "Người Tổ chức Cuộc họp"
    permissions:
      - "meeting:rooms:read"
      - "meeting:bookings:read"
      - "meeting:bookings:write"
      - "meeting:bookings:cancel"
      - "meeting:attendees:read"
      - "meeting:attendees:write"
      - "meeting:agendas:read"
      - "meeting:agendas:write"
      - "meeting:minutes:read"
      - "meeting:minutes:write"
      - "meeting:action_items:read"
      - "meeting:action_items:write"
      - "meeting:action_items:delete"

  - name: "meeting_admin"
    display_name: "Quản trị Phòng họp"
    description: "Quản trị Phòng họp"
    permissions:
      - "meeting:rooms:read"
      - "meeting:rooms:write"
      - "meeting:bookings:read"
      - "meeting:bookings:read_all"
      - "meeting:bookings:write"
      - "meeting:bookings:cancel"
      - "meeting:attendees:read"
      - "meeting:attendees:write"
      - "meeting:agendas:read"
      - "meeting:agendas:write"
      - "meeting:minutes:read"
      - "meeting:minutes:write"
      - "meeting:action_items:read"
      - "meeting:action_items:write"
      - "meeting:action_items:delete"
      - "meeting:reports:read"

  - name: "meeting_viewer"
    display_name: "Người Tham dự Cuộc họp"
    description: "Người Tham dự Cuộc họp"
    permissions:
      - "meeting:rooms:read"
      - "meeting:bookings:read"
      - "meeting:attendees:read"
      - "meeting:agendas:read"
      - "meeting:minutes:read"
      - "meeting:action_items:read"

event_subscriptions:
  - source_plugin: "hr-module"
    event_types:
      - "hr.employee.deactivated"
    handler_workflow: "workflows/meeting_booking.json"

event_publications:
  - event_type: "meeting.booking.created"
    description: "Khi lịch đặt phòng họp mới được tạo"
    payload_schema:
      booking_id: "uuid"
      room_id: "uuid"

  - event_type: "meeting.action_item.created"
    description: "Khi việc cần làm sau cuộc họp được tạo"
    payload_schema:
      action_item_id: "uuid"
      booking_id: "uuid"

  - event_type: "meeting.booking.cancelled"
    description: "Khi lịch đặt phòng họp bị hủy"
    payload_schema:
      booking_id: "uuid"

ngsi:
  entities:
    - table: "meeting_rooms"
      type: "Room"
      id_pattern: "urn:ngsi-ld:Room:{tenant}:{id}"
      attributes:
        - column: "name"
          target: "name"
          type: "Property"
        - column: "capacity"
          target: "capacity"
          type: "Property"
        - column: "floor"
          target: "floor"
          type: "Property"
        - column: "is_active"
          target: "isActive"
          type: "Property"
      relationships: []
      geo_attribute:
        target: "location"
    - table: "meeting_bookings"
      type: "MeetingBooking"
      id_pattern: "urn:ngsi-ld:MeetingBooking:{tenant}:{id}"
      attributes:
        - column: "title"
          target: "title"
          type: "Property"
        - column: "start_time"
          target: "startTime"
          type: "Property"
        - column: "end_time"
          target: "endTime"
          type: "Property"
        - column: "status"
          target: "status"
          type: "Property"
      relationships:
        - column: "room_id"
          target: "heldInRoom"
          entity_type: "Room"
          id_pattern: "urn:ngsi-ld:Room:{tenant}:{room_id}"
        - column: "organizer_id"
          target: "organizedBy"
          entity_type: "Employee"
          id_pattern: "urn:ngsi-ld:Employee:{tenant}:{organizer_id}"
