# Plugin Manifest — crm-module (Quản lý Khách hàng - CRM)

name: "crm-module"
display_name: "Quản lý Khách hàng - CRM"
version: "1.1.0"
description: |
  Quản lý toàn bộ vòng đời quan hệ khách hàng: từ tiếp nhận lead, nuôi dưỡng cơ hội bán hàng, quản lý hợp đồng đến chăm sóc sau bán và xử lý phản ánh.
author: "ICTU Team"
license: "AGPL-3.0-or-later"
icon_url: "/plugins/crm-module/icon.png"
is_official: true
homepage_url: "https://github.com/CuongKenn/ICTU_Proteus-os"
category: "CRM"
credentials_schema: []

compatibility:
  proteus_os_min_version: "1.0.0"
  dsl_spec_version: "1.0"

database:
  tables:
    - "crm_customers"
    - "crm_contacts"
    - "crm_leads"
    - "crm_opportunities"
    - "crm_activities"
    - "crm_tickets"
    - "crm_ticket_comments"
    - "crm_surveys"

  seed_file: "db/seed_data.sql"

workflows:
  - id: "wf_lead_capture"
    name: "Tiếp nhận Lead Mới"
    trigger: "webhook"
    file: "workflows/lead_capture.json"

  - id: "wf_opportunity_followup"
    name: "Nhắc nhở Follow-up Cơ hội"
    trigger: "cron"
    cron_expression: "0 9 * * *"
    file: "workflows/opportunity_followup.json"

  - id: "wf_ticket_assignment"
    name: "Phân công Ticket & SLA"
    trigger: "webhook"
    file: "workflows/ticket_assignment.json"

  - id: "wf_customer_satisfaction"
    name: "Khảo sát NPS Khách hàng"
    trigger: "webhook"
    file: "workflows/customer_satisfaction.json"

dashboards:
  - id: "dash_sales_pipeline"
    name: "Phễu bán hàng (Pipeline)"
    file: "dashboards/sales_pipeline.json"

  - id: "dash_customer_health"
    name: "Sức khỏe Khách hàng & SLA"
    file: "dashboards/customer_health.json"

ui:
  # appsmith_app: "ui/appsmith_app.json"
  external_url: "${PLUGINS_MFE_URL}/crm-module"

roles:
  - name: "crm_sales"
    display_name: "Nhân viên Kinh doanh"
    description: "Nhân viên Kinh doanh"
    permissions:
      - "crm:customers:read"
      - "crm:customers:write"
      - "crm:contacts:read"
      - "crm:contacts:write"
      - "crm:leads:read"
      - "crm:leads:write"
      - "crm:opportunities:read"
      - "crm:opportunities:write"
      - "crm:activities:read"
      - "crm:activities:write"
      - "crm:tickets:read"
      - "crm:ticket_comments:read"
      - "crm:surveys:read"

  - name: "crm_support"
    display_name: "Nhân viên Hỗ trợ Khách hàng"
    description: "Nhân viên Hỗ trợ Khách hàng"
    permissions:
      - "crm:customers:read"
      - "crm:contacts:read"
      - "crm:leads:read"
      - "crm:opportunities:read"
      - "crm:activities:read"
      - "crm:activities:write"
      - "crm:tickets:read"
      - "crm:tickets:write"
      - "crm:ticket_comments:read"
      - "crm:ticket_comments:write"
      - "crm:surveys:read"
      - "crm:surveys:write"

  - name: "crm_manager"
    display_name: "Quản lý CRM"
    description: "Quản lý CRM"
    permissions:
      - "crm:customers:read"
      - "crm:customers:write"
      - "crm:contacts:read"
      - "crm:contacts:write"
      - "crm:leads:read"
      - "crm:leads:write"
      - "crm:opportunities:read"
      - "crm:opportunities:write"
      - "crm:activities:read"
      - "crm:activities:write"
      - "crm:tickets:read"
      - "crm:tickets:write"
      - "crm:ticket_comments:read"
      - "crm:ticket_comments:write"
      - "crm:surveys:read"
      - "crm:surveys:write"
      - "crm:reports:read"
      - "crm:assign:all"

  - name: "crm_viewer"
    display_name: "Người xem CRM"
    description: "Khách / Người xem (BGĐ)"
    permissions:
      - "crm:customers:read"
      - "crm:contacts:read"
      - "crm:leads:read"
      - "crm:opportunities:read"
      - "crm:activities:read"
      - "crm:tickets:read"
      - "crm:ticket_comments:read"
      - "crm:surveys:read"
      - "crm:reports:read"

event_subscriptions:
  - source_plugin: "procurement-module"
    event_types:
      - "procurement.contract.signed"
    handler_workflow: "workflows/customer_satisfaction.json"
  - source_plugin: "hr-module"
    event_types:
      - "hr.employee.deactivated"
    handler_workflow: "workflows/ticket_assignment.json"

event_publications:
  - event_type: "crm.customer.created"
    description: "Khi khách hàng mới được tạo"
    payload_schema:
      customer_id: "uuid"

  - event_type: "crm.opportunity.won"
    description: "Khi cơ hội bán hàng chốt thành công"
    payload_schema:
      opportunity_id: "uuid"
      value: "number"

  - event_type: "crm.ticket.resolved"
    description: "Khi ticket hỗ trợ khách hàng được giải quyết"
    payload_schema:
      ticket_id: "uuid"

ngsi:
  entities:
    - table: "crm_customers"
      type: "Customer"
      id_pattern: "urn:ngsi-ld:Customer:{tenant}:{id}"
      attributes:
        - column: "name"
          target: "companyName"
          type: "Property"
        - column: "type"
          target: "customerType"
          type: "Property"
        - column: "industry"
          target: "industry"
          type: "Property"
        - column: "company_size"
          target: "companySize"
          type: "Property"
        - column: "status"
          target: "status"
          type: "Property"
      relationships: []
    - table: "crm_leads"
      type: "Lead"
      id_pattern: "urn:ngsi-ld:Lead:{tenant}:{id}"
      attributes:
        - column: "company_name"
          target: "companyName"
          type: "Property"
        - column: "source"
          target: "source"
          type: "Property"
        - column: "stage"
          target: "status"
          type: "Property"
      relationships:
        - column: "assigned_to"
          target: "assignedTo"
          entity_type: "Employee"
          id_pattern: "urn:ngsi-ld:Employee:{tenant}:{assigned_to}"
