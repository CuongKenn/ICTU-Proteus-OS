# Plugin Manifest — project-module (Quản lý Dự án Công việc)

name: "project-module"
display_name: "Quản lý Dự án Công việc"
version: "1.0.0"
description: |
  Quản lý dự án, theo dõi tiến độ, phân công công việc, milestone và KPIs.
author: "ICTU Team"
license: "AGPL-3.0-or-later"
icon_url: "/plugins/project-module/icon.png"
is_official: true
homepage_url: "https://github.com/CuongKenn/ICTU_Proteus-os"
category: "Operations"
credentials_schema: []

compatibility:
  proteus_os_min_version: "1.0.0"
  dsl_spec_version: "1.0"

database:
  tables:
    - "project_projects"
    - "project_milestones"
    - "project_tasks"
    - "project_task_comments"
    - "project_time_logs"
    - "project_members"

  seed_file: "db/seed_data.sql"

workflows:
  - id: "wf_task_assignment"
    name: "Giao task & Nhắc nhở"
    trigger: "webhook"
    file: "workflows/task_assignment.json"

  - id: "wf_overdue_task_alert"
    name: "Cảnh báo task quá hạn"
    trigger: "cron"
    cron_expression: "0 9 * * *"
    file: "workflows/overdue_task_alert.json"

  - id: "wf_milestone_reminder"
    name: "Nhắc nhở milestone sắp tới"
    trigger: "cron"
    cron_expression: "0 8 * * *"
    file: "workflows/milestone_reminder.json"

  - id: "wf_project_status_report"
    name: "Báo cáo tiến độ dự án"
    trigger: "cron"
    cron_expression: "0 7 * * 1"
    file: "workflows/project_status_report.json"

dashboards:
  - id: "dash_project_overview"
    name: "Tổng quan dự án"
    file: "dashboards/project_overview.json"

  - id: "dash_team_workload"
    name: "Phân bổ công việc"
    file: "dashboards/team_workload.json"

ui:
  appsmith_app: "ui/appsmith_app.json"
  external_url: "${PLUGINS_MFE_URL}/project-module"

roles:
  - name: "project_manager"
    display_name: "Quản lý dự án"
    description: "Quản lý dự án"
    permissions:
      - "project:projects:read"
      - "project:projects:write"
      - "project:projects:delete"
      - "project:milestones:read"
      - "project:milestones:write"
      - "project:milestones:delete"
      - "project:tasks:read"
      - "project:tasks:write"
      - "project:tasks:delete"
      - "project:tasks:assign"
      - "project:task_comments:read"
      - "project:task_comments:write"
      - "project:time_logs:read"
      - "project:time_logs:write"
      - "project:members:read"
      - "project:members:write"
      - "project:reports:read"

  - name: "project_member"
    display_name: "Thành viên dự án"
    description: "Thành viên dự án"
    permissions:
      - "project:projects:read"
      - "project:milestones:read"
      - "project:tasks:read"
      - "project:tasks:write"
      - "project:task_comments:read"
      - "project:task_comments:write"
      - "project:time_logs:read"
      - "project:time_logs:write"
      - "project:members:read"

  - name: "project_viewer"
    display_name: "Người xem dự án"
    description: "Khách / Người xem"
    permissions:
      - "project:projects:read"
      - "project:milestones:read"
      - "project:tasks:read"
      - "project:task_comments:read"
      - "project:time_logs:read"
      - "project:members:read"
      - "project:reports:read"

event_subscriptions:
  - source_plugin: "hr-module"
    event_types:
      - "hr.employee.deactivated"
    handler_workflow: "workflows/task_assignment.json"

event_publications:
  - event_type: "project.task.completed"
    description: "Khi công việc trong dự án hoàn thành"
    payload_schema:
      task_id: "uuid"
      project_id: "uuid"

  - event_type: "project.project.completed"
    description: "Khi dự án hoàn thành"
    payload_schema:
      project_id: "uuid"

  - event_type: "project.milestone.reached"
    description: "Khi đạt cột mốc dự án"
    payload_schema:
      milestone_id: "uuid"
      project_id: "uuid"

ngsi:
  entities:
    - table: "project_projects"
      type: "Project"
      id_pattern: "urn:ngsi-ld:Project:{tenant}:{id}"
      attributes:
        - column: "code"
          target: "projectCode"
          type: "Property"
        - column: "name"
          target: "name"
          type: "Property"
        - column: "start_date"
          target: "startDate"
          type: "Property"
        - column: "end_date"
          target: "endDate"
          type: "Property"
        - column: "status"
          target: "status"
          type: "Property"
      relationships:
        - column: "manager_id"
          target: "leadBy"
          entity_type: "Employee"
          id_pattern: "urn:ngsi-ld:Employee:{tenant}:{manager_id}"
    - table: "project_tasks"
      type: "Task"
      id_pattern: "urn:ngsi-ld:Task:{tenant}:{id}"
      attributes:
        - column: "title"
          target: "title"
          type: "Property"
        - column: "priority"
          target: "priority"
          type: "Property"
        - column: "status"
          target: "status"
          type: "Property"
        - column: "due_date"
          target: "dueDate"
          type: "Property"
      relationships:
        - column: "project_id"
          target: "partOfProject"
          entity_type: "Project"
          id_pattern: "urn:ngsi-ld:Project:{tenant}:{project_id}"
        - column: "assignee_id"
          target: "assignedTo"
          entity_type: "Employee"
          id_pattern: "urn:ngsi-ld:Employee:{tenant}:{assignee_id}"
